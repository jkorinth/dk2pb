name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # release-please derives the next version from the merged commit subject,
      # which for a squash merge is the PR title.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          grep -qP '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+' <<<"$TITLE" \
            || { echo "PR title must be a conventional commit, e.g. 'feat: add foo' or 'fix(ui): ...'"; exit 1; }
